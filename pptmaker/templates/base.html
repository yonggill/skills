<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>

  <!-- Google Fonts -->
  {{FONT_LINKS}}

  <!-- reveal.js core -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4.6.1/dist/reset.css" />
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4.6.1/dist/reveal.css" />
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4.6.1/plugin/highlight/monokai.css" />

  <style>
    /* ===== Design System Tokens ===== */
    {{DESIGN_TOKENS}}

    /* ===== reveal.js Variable Wiring ===== */
    .reveal {
      --r-background-color: var(--color-background);
      --r-main-color: var(--color-text-primary);
      --r-heading-color: var(--color-text-primary);
      --r-link-color: var(--color-link);
      --r-link-color-hover: var(--color-primary);
      --r-selection-background-color: color-mix(in srgb, var(--color-primary) 30%, white);
      --r-selection-color: var(--color-text-primary);
      --r-main-font-size: 1.125rem;
      --r-heading-text-transform: none;
      --r-heading-font-weight: 700;
      --r-heading-line-height: 1.2;
      --r-block-margin: 1.5rem;
      --r-code-font: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* ===== Global Slide Overrides ===== */
    /* CRITICAL: center:false + disableLayout:true in Reveal config.
       All positioning, centering, and sizing handled by CSS. */
    .reveal .slides section {
      width: 1280px !important;
      height: 720px !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      word-break: keep-all;
      padding: 2.5rem 3rem;
      text-align: left;
    }

    /* All direct children must respect container width */
    .reveal .slides section > * {
      max-width: 100%;
      min-width: 0;
    }

    /* All grids and flex containers: prevent overflow */
    .reveal .slides section [style*="grid"],
    .reveal .slides section [class*="grid"],
    .reveal .slides section [class*="flow"],
    .reveal .slides section [class*="col-"] {
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .reveal .slides {
      text-align: left;
    }

    /* Heading alignment: left for content, center for title/divider */
    .reveal h1, .reveal h2, .reveal h3 {
      text-align: left;
    }

    /* ===== Layouts ===== */
    {{LAYOUT_CSS}}

    /* ===== Layout Centering (disableLayout:true requires explicit centering) ===== */
    .layout-title {
      display: flex !important; flex-direction: column;
      justify-content: center; align-items: flex-start;
      height: 100%; padding: 3rem 4rem; gap: var(--space-5); position: relative;
    }
    .layout-section-divider {
      display: flex !important; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      height: 100%; padding: 3rem 4rem; gap: var(--space-4); position: relative;
    }
    .layout-section-divider h2, .layout-section-divider p { text-align: center; }
    .layout-simple {
      display: flex !important; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      height: 100%; padding: 3rem 4rem; gap: var(--space-5);
    }
    .layout-quote {
      display: flex !important; flex-direction: column;
      justify-content: center; align-items: center;
      height: 100%; padding: 3rem 4rem;
    }
    .layout-text, .layout-three-col, .layout-kpi, .layout-process, .layout-agenda,
    .layout-two-col, .layout-before-after {
      display: flex !important; flex-direction: column;
      justify-content: center; height: 100%; gap: 1rem;
    }
    .layout-text-image, .layout-image-text {
      display: grid !important; grid-template-columns: 1fr 1fr;
      gap: 1.5rem; align-items: center; height: 100%; padding: 2rem 3rem;
    }
    .layout-code {
      display: flex !important; flex-direction: column;
      justify-content: flex-start; height: 100%; gap: 1rem; padding: 1.5rem 2rem;
    }

    /* ===== Overflow Guards ===== */
    .three-col-grid, .kpi-grid-1x4, .kpi-grid-2x2, .kpi-grid-1x3, .kpi-grid-featured,
    .col-header, .col-body, .agenda-list, .code-showcase-grid, .process-flow {
      width: 100%; min-width: 0; overflow: hidden;
    }
    .feature-card, .kpi-card, .col-card, .col-label,
    .code-pane, .code-result-pane, .process-step, .team-card, .pricing-card {
      min-width: 0; overflow: hidden;
    }
    .process-step { flex: 1 1 0; }
    .process-arrow { flex: 0 0 auto; font-size: 1rem; }
    .code-showcase-grid { grid-template-columns: 1fr 1fr; }

    /* ===== Components ===== */
    {{COMPONENT_CSS}}
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">
    {{SLIDES}}
  </div>
</div>

<script src="https://unpkg.com/reveal.js@4.6.1/dist/reveal.js"></script>
<script src="https://unpkg.com/reveal.js@4.6.1/plugin/zoom/zoom.js"></script>
<script src="https://unpkg.com/reveal.js@4.6.1/plugin/notes/notes.js"></script>
<script src="https://unpkg.com/reveal.js@4.6.1/plugin/highlight/highlight.js"></script>
{{EXTRA_PLUGINS}}

<script>
  Reveal.initialize({
    hash: true,
    controls: true,
    progress: true,
    center: false,
    disableLayout: true,
    transition: '{{TRANSITION}}',
    width: 1280,
    height: 720,
    margin: 0,
    plugins: [RevealZoom, RevealNotes, RevealHighlight{{EXTRA_PLUGIN_NAMES}}]
  });
</script>

</body>
</html>
